<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetcodeMetrix</title>
  <link rel="stylesheet" href="style.css">

  </link>


</head>

<body>

  <div class="container">
    <h1>Leetcode Profile </h1>
    <div class="user-container">
      <p>Enter your name:</p>
      <div>
        <input type="text" placeholder="enter your name" id='user-name'>
        <button id="search-btn" >Search</button>
      </div>

    </div>

    <div class="stats-container">
      <div class="progress">
        <div class="progress-item">
          <div class="easy-progress">
            <span id="easy-label">Easy</span>

          </div>
        </div>
        <div class="progress-item">
          <div class="medium-progress">
            <span id="medium-label">Medium</span>

          </div>
        </div>
        <div class="progress-item">
          <div class="Hard-progress">
            <span id="hard-label">Hard</span>

          </div>
        </div>

      </div>
      <div class="stats-card">
        <!-- by using js -->
      </div>
    </div>
  </div>
  <script src="sc.js"></script>

</body>

</html>
